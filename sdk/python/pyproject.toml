[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wit-api"
version = "0.1.0"
description = "Zero-dependency Python client for the wit URL API (read GitHub repositories without cloning)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["github", "agents", "wit", "code-search", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/thehumanworks/wit"
Documentation = "https://wit.thehuman.sh/api/llms.txt"

[tool.setuptools.packages.find]
include = ["wit_api*"]
