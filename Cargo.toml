[package]
name = "wit"
version = "0.1.13"
edition = "2024"

[lib]
name = "wit"
path = "src/lib.rs"

# [[bin]]
# name = "wit"
# path = "src/main.rs"

[[bin]]
name = "wit"
path = "src/cli.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.56", features = ["derive"] }
colored = "3.1.1"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
scraper = "0.23"
gix = { version = "0.78.0", features = ["blocking-http-transport-reqwest", "blocking-network-client", "max-performance"] }
ptree = "0.5.2"
gix-traverse = "0.52.0"
gix-object = "0.55.0"
gix-diff = "0.58.0"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
grep-matcher = "0.1.8"
fs2 = "0.4.3"
regex = "1"
globset = "0.4.18"

[dev-dependencies]
tempfile = "3.13.0"









