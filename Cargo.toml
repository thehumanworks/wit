[package]
name = "wit"
version = "0.1.0"
edition = "2024"

[lib]
name = "wit"
path = "src/lib.rs"

[[bin]]
name = "wit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
