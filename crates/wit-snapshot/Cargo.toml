[package]
name = "wit-snapshot"
version = "0.1.0"
edition = "2024"
description = "No-FS GitHub repository snapshots via MemoryBackend (native HTTP or wasm32 host fetch)"
license = "MIT"

[lib]
name = "wit_snapshot"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wit-nofS-demo"
path = "src/bin/wit_nofS_demo.rs"
required-features = ["demo"]

[[bin]]
name = "wit-snapshot-wasmtime-fixture"
path = "src/bin/wasmtime_fixture.rs"
required-features = ["wasmtime-fixture"]

[features]
default = ["http"]
# Native GitHub client (reqwest). Do not enable for wasm32 builds.
http = ["dep:reqwest", "dep:tokio"]
demo = ["http", "dep:clap", "dep:tokio", "dep:rustls"]
# Fixture-only surface for wasmtime no-FS demos (no HTTP client, no TLS).
fixture = []
# Native host that loads the wasm32 module with fixture-backed fetch (CI evidence).
wasmtime-fixture = ["dep:wasmtime"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
thiserror = "2"
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros"] }
clap = { workspace = true, optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs", "std"] }
wasmtime = { version = "29", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
tempfile = "3.13.0"
