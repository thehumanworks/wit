[package]
name = "wit"
version = "0.1.33"
edition = "2024"

[lib]
name = "wit"
path = "src/lib.rs"

[[bin]]
name = "wit"
path = "src/cli.rs"

[[bin]]
name = "wit-mcp"
path = "src/bin/wit-mcp.rs"

[dependencies]
wits = { path = "../wits" }
wit-snapshot = { path = "../wit-snapshot", features = ["http"] }
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
gix = { version = "0.78.0", features = ["blocking-http-transport-reqwest", "blocking-network-client", "max-performance"] }
ptree = "0.5.2"
gix-traverse = "0.52.0"
gix-object = "0.55.0"
gix-diff = "0.58.0"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
grep-matcher = "0.1.8"
fs2 = "0.4.3"
regex = "1"
globset = "0.4.18"
octocrab = "0.49.7"
rustls = "0.23.36"
rmcp = { version = "2", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3.13.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
wit-quickjs-spike = { path = "../wit-quickjs-spike" }

[dev-dependencies]
wiremock = "0.6"
rmcp = { version = "2", features = ["client", "transport-child-process"] }








