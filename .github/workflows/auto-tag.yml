name: auto-tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          max_attempts=5
          attempt=0

          while [ "${attempt}" -lt "${max_attempts}" ]; do
            attempt=$((attempt + 1))
            echo "Auto-tag attempt ${attempt}/${max_attempts}"

            git fetch origin main --tags
            git checkout -B main origin/main

            latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            if [ -z "${latest_tag}" ]; then
              current_version="0.0.0"
            else
              current_version="${latest_tag#v}"
            fi

            IFS='.' read -r major minor patch <<< "${current_version}"
            next_version="${major}.${minor}.$((patch + 1))"
            tag="v${next_version}"

            if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
              echo "Tag ${tag} already exists on origin; retrying with a newer patch."
              sleep 2
              continue
            fi

            node scripts/release/set-cargo-version.mjs \
              --version "${next_version}" \
              --cargo-toml crates/wit/Cargo.toml \
              --cargo-lock Cargo.lock

            git add crates/wit/Cargo.toml Cargo.lock
            if git diff --cached --quiet; then
              echo "crates/wit/Cargo.toml version already set to ${next_version}."
              exit 0
            fi

            git commit \
              -m "chore: release ${tag}" \
              -m "Automated version bump and release tag for a push to main."
            git tag "${tag}"

            if git push origin main "${tag}"; then
              echo "Published ${tag}"
              gh workflow run release --ref "${tag}"
              echo "Dispatched release workflow for ${tag}"
              exit 0
            fi

            echo "Push failed (likely non-fast-forward); retrying."
            git tag -d "${tag}" || true
            sleep 2
          done

          echo "Failed to push release commit/tag after ${max_attempts} attempts."
          exit 1
