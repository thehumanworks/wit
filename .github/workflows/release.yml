name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            bin: wit
            use_cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            bin: wit
            use_cross: true
          - target: x86_64-apple-darwin
            runner: macos-13
            archive: tar.gz
            bin: wit
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
            bin: wit
            use_cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            bin: wit.exe
            use_cross: false
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            bin: wit.exe
            use_cross: false
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build binary (cross)
        if: matrix.use_cross
        shell: bash
        run: |
          set -euo pipefail
          cross build --locked --release --target "${{ matrix.target }}"

      - name: Build binary (cargo on Unix)
        if: matrix.use_cross == false && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}"

      - name: Build binary (cargo on Windows)
        if: matrix.use_cross == false && runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          artifact="wit-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "${artifact}" "${{ matrix.bin }}"

      - name: Package binary (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $artifact = "wit-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath $artifact -Force

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: wit-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum wit-* > wit-checksums.txt

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wit-*.tar.gz
            dist/wit-*.zip
            dist/wit-checksums.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
