name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            bin: wit
            use_cross: true
            platform: linux
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            bin: wit
            use_cross: true
            platform: linux
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-14
            archive: tar.gz
            bin: wit
            use_cross: false
            platform: macos
            arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
            bin: wit
            use_cross: false
            platform: macos
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            bin: wit.exe
            use_cross: false
            platform: windows
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            bin: wit.exe
            use_cross: false
            experimental: true
            platform: windows
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build binary (cross)
        if: matrix.use_cross
        shell: bash
        run: |
          set -euo pipefail
          cross build --locked --release --target "${{ matrix.target }}"

      - name: Build binary (cargo on Unix)
        if: matrix.use_cross == false && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}"

      - name: Build binary (cargo on Windows)
        if: matrix.use_cross == false && runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          artifact="wit-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "${artifact}" "${{ matrix.bin }}"

      - name: Package binary (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $artifact = "wit-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath $artifact -Force

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: wit-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum wit-* > wit-checksums.txt

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wit-*.tar.gz
            dist/wit-*.zip
            dist/wit-checksums.txt
          fail_on_unmatched_files: false
          generate_release_notes: true

  publish_npm:
    name: publish npm packages
    runs-on: ubuntu-latest
    needs: release
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      base_package_name: ${{ steps.npm_metadata.outputs.base_package_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve npm scope
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          set -euo pipefail
          scope_input="${NPM_SCOPE:-}"
          if [ -z "${scope_input}" ]; then
            scope_input="$(npm whoami)"
          fi
          scope_input="${scope_input#@}"
          if [ -z "${scope_input}" ]; then
            echo "Unable to determine npm scope."
            exit 1
          fi
          echo "NPM_SCOPE=@${scope_input}" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Verify release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/npm/assert-release-version.mjs --tag "${GITHUB_REF_NAME}" --cargo-toml Cargo.toml)"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build npm packages from release artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/npm/build-packages.mjs \
            --version "${VERSION}" \
            --artifacts-dir dist \
            --output-dir dist/npm \
            --npm-scope "${NPM_SCOPE}"

      - name: Capture npm package metadata
        id: npm_metadata
        shell: bash
        run: |
          set -euo pipefail
          base_package_name="$(jq -r '.basePackageName' dist/npm/manifest.json)"
          if [ -z "${base_package_name}" ] || [ "${base_package_name}" = "null" ]; then
            echo "Unable to resolve base npm package name from dist/npm/manifest.json"
            exit 1
          fi
          echo "base_package_name=${base_package_name}" >> "${GITHUB_OUTPUT}"

      - name: Validate npm tarballs
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in $(find dist/npm/platform -mindepth 1 -maxdepth 1 -type d | sort); do
            (cd "${package_dir}" && npm pack >/dev/null)
          done
          (cd dist/npm/base && npm pack >/dev/null)

      - name: Ensure npm token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN secret is required to publish npm packages."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Publish platform npm packages
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in $(find dist/npm/platform -mindepth 1 -maxdepth 1 -type d | sort); do
            npm publish "${package_dir}" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Publish base npm package
        shell: bash
        run: |
          set -euo pipefail
          npm publish dist/npm/base --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  npm_smoke:
    name: npm smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: publish_npm
    continue-on-error: ${{ matrix.allow_failure == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            allow_failure: false
          - runner: macos-14
            allow_failure: true
          - runner: windows-latest
            allow_failure: true

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and smoke test package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="${{ needs.publish_npm.outputs.base_package_name }}@${{ needs.publish_npm.outputs.version }}"
          max_attempts=20
          attempts=0
          until npm install -g "${package}"; do
            attempts=$((attempts + 1))
            if [ "${attempts}" -ge "${max_attempts}" ]; then
              exit 1
            fi
            sleep 15
          done
          wit --help
          wit rg --help
          npx "${package}" --help

      - name: Install and smoke test package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "${{ needs.publish_npm.outputs.base_package_name }}@${{ needs.publish_npm.outputs.version }}"
          $maxAttempts = 20
          $attempt = 0
          while ($true) {
            try {
              npm install -g $package
              break
            } catch {
              $attempt += 1
              if ($attempt -ge $maxAttempts) {
                throw
              }
              Start-Sleep -Seconds 15
            }
          }
          wit --help
          wit rg --help
          npx $package --help
