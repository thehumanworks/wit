name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_ref:
    name: validate release ref
    runs-on: ubuntu-latest

    steps:
      - name: Validate semver tag ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release workflow must run from a semver tag ref, got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}"
            exit 1
          fi

  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: validate_ref
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            bin: wit
            mcp_bin: wit-mcp
            use_cross: true
            native_smoke: true
            platform: linux
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            bin: wit
            mcp_bin: wit-mcp
            use_cross: true
            native_smoke: false
            platform: linux
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-14
            archive: tar.gz
            bin: wit
            mcp_bin: wit-mcp
            use_cross: false
            native_smoke: false
            platform: macos
            arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
            bin: wit
            mcp_bin: wit-mcp
            use_cross: false
            native_smoke: true
            platform: macos
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            bin: wit.exe
            mcp_bin: wit-mcp.exe
            use_cross: false
            native_smoke: true
            platform: windows
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            bin: wit.exe
            mcp_bin: wit-mcp.exe
            use_cross: false
            native_smoke: false
            platform: windows
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build binary (cross)
        if: matrix.use_cross
        shell: bash
        run: |
          set -euo pipefail
          cross build --locked --release --target "${{ matrix.target }}" -p wit --bins

      - name: Build binary (cargo on Unix)
        if: matrix.use_cross == false && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}" -p wit --bins

      - name: Build binary (cargo on Windows)
        if: matrix.use_cross == false && runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release --target "${{ matrix.target }}" -p wit --bins

      - name: Package binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          artifact="wit-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "${artifact}" "${{ matrix.bin }}" "${{ matrix.mcp_bin }}"

      - name: Package binary (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $artifact = "wit-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          $files = @(
            "target/${{ matrix.target }}/release/${{ matrix.bin }}",
            "target/${{ matrix.target }}/release/${{ matrix.mcp_bin }}"
          )
          Compress-Archive -Path $files -DestinationPath $artifact -Force

      - name: Smoke direct and Code Mode tools (Unix)
        if: matrix.native_smoke && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke_mcp_modes.mjs "target/${{ matrix.target }}/release/${{ matrix.mcp_bin }}"
          node scripts/smoke_mcp_modes.mjs "target/${{ matrix.target }}/release/${{ matrix.bin }}" mcp --transport stdio

      - name: Smoke direct and Code Mode tools (Windows)
        if: matrix.native_smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/smoke_mcp_modes.mjs "target/${{ matrix.target }}/release/${{ matrix.mcp_bin }}"
          node scripts/smoke_mcp_modes.mjs "target/${{ matrix.target }}/release/${{ matrix.bin }}" mcp --transport stdio

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: wit-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive }}
          if-no-files-found: error

  build-wasm:
    name: build wit_snapshot.wasm
    needs: validate_ref
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build release wit_snapshot.wasm (no reqwest)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p wit-snapshot \
            --target wasm32-unknown-unknown --no-default-features
          if cargo tree -p wit-snapshot --target wasm32-unknown-unknown \
            --no-default-features -i reqwest >/dev/null 2>&1; then
            echo "reqwest must not appear in wit-snapshot wasm32 dependency tree" >&2
            cargo tree -p wit-snapshot --target wasm32-unknown-unknown \
              --no-default-features -i reqwest || true
            exit 1
          fi
          cp target/wasm32-unknown-unknown/release/wit_snapshot.wasm wit_snapshot.wasm

      - name: Upload wit_snapshot.wasm
        uses: actions/upload-artifact@v4
        with:
          name: dist-wit_snapshot-wasm
          path: wit_snapshot.wasm
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [build, build-wasm]
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum wit-*.tar.gz wit-*.zip wit_snapshot.wasm > wit-checksums.txt

      - name: Build SPDX dependency SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: dist/wit-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wit-*.tar.gz
            dist/wit-*.zip
            dist/wit_snapshot.wasm
            dist/wit-checksums.txt
            dist/wit-sbom.spdx.json
            THIRD-PARTY-LICENSES.md
          fail_on_unmatched_files: false
          generate_release_notes: true

  publish_npm:
    name: publish npm
    needs: release
    uses: ./.github/workflows/publish-npm.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
