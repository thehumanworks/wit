name: wit-cache deploy

# Shared no-login pack cache (ADR 0009): Cloudflare Worker `wit-cache` in
# services/wit-cache. Independent of the url-api Pages project.

on:
  push:
    branches: [main]
    paths:
      - "services/wit-cache/**"
      - ".github/workflows/cache-worker-deploy.yml"
  workflow_dispatch:

# No pull_request trigger: forks never get the Cloudflare secrets.
permissions:
  contents: read

concurrency:
  group: wit-cache-deploy
  cancel-in-progress: false

env:
  BUCKET: wit-cache-packs
  QUEUE: wit-cache-fills

jobs:
  deploy:
    name: cloudflare worker (wit-cache)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/wit-cache
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "error: missing repository secret(s): ${missing[*]}" >&2
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under" >&2
            echo "Settings > Secrets and variables > Actions, then re-run this workflow." >&2
            exit 1
          fi
          echo "Cloudflare deploy secrets are set (values never printed)."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Worker unit tests
        run: npm test

      - name: Ensure the R2 bucket, lifecycle rules, and queue exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 r2 bucket info "$BUCKET" >/dev/null 2>&1 \
            || npx --yes wrangler@4 r2 bucket create "$BUCKET"
          rules="$RUNNER_TEMP/lifecycle.txt"
          npx --yes wrangler@4 r2 bucket lifecycle list "$BUCKET" > "$rules"
          grep -Fq "expire-30d" "$rules" \
            || npx --yes wrangler@4 r2 bucket lifecycle add "$BUCKET" expire-30d v1/ --expire-days 30 --force
          grep -Fq "abort-multipart-1d" "$rules" \
            || npx --yes wrangler@4 r2 bucket lifecycle add "$BUCKET" abort-multipart-1d "" --abort-multipart-days 1 --force
          npx --yes wrangler@4 queues info "$QUEUE" >/dev/null 2>&1 \
            || npx --yes wrangler@4 queues create "$QUEUE"

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Smoke the deployed Worker
        run: |
          set -euo pipefail
          curl -fsS https://wit-cache.rodat-human-ada.workers.dev/ | grep -Fq '"service": "wit-cache"'
          curl -fsS https://wit-cache.rodat-human-ada.workers.dev/v1/stats | grep -Fq '"stored_bytes"'
          echo "wit-cache answers / and /v1/stats."
